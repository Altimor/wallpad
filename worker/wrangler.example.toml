name = "wallpad"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# TV registry: id -> { name, ip, port, pub4, pub6, at }
[[kv_namespaces]]
binding = "TVS"
id = "YOUR_KV_NAMESPACE_ID"   # wrangler kv namespace create TVS

# installer + app zip for the Mac minis
[assets]
directory = "./public"
